name: Deploy MochiRead

on:
  push:
    branches: [main]
    paths:
      - 'apps/mochiread/**'
      - 'packages/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/mochiread-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm --filter mochiread exec tsc --noEmit
      - run: pnpm --filter mochiread exec node --experimental-strip-types --test tests/backup-format.test.mjs
      - run: node apps/mochiread/scripts/build-web-dictionaries.mjs
      - run: pnpm --filter mochiread exec expo export --platform web
        env:
          MOCHIREAD_BASE_URL: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mochiread/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
